<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your Night Light</title>
  <meta name="description" content="A little place for Darlala, for whenever she needs it.">
  <meta name="theme-color" content="#0F1430">
  <meta property="og:title" content="Your Night Light">
  <meta property="og:description" content="A little place, just for you.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23F6E7B8' d='M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="hero" id="top">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="hero-txt">
      <p class="eyebrow" id="greetTag">A little place, just for you</p>
      <h1>Hi, <em data-f="herName"></em>.</h1>
      <p class="lead" data-f="intro"></p>
    </div>
    <div class="moonbox">
      <canvas id="moon" width="480" height="480" role="img" aria-label="Tonight's moon"></canvas>
      <p class="hand" id="moonLine"></p>
      <small id="moonFact"></small>
    </div>
  </div>
</section>

<section class="daily" aria-label="Today's reminder">
  <div class="wrap">
    <div class="quote">
      <p class="qtag" id="qTag">Today's reminder</p>
      <p class="q" id="dailyQ"></p>
      <p class="by">— <span data-f="yourName"></span></p>
      <div class="row"><button class="btn moon" type="button" id="dailyNext">Another one</button></div>
    </div>
  </div>
</section>

<section class="feel" aria-labelledby="feelHead">
  <div class="wrap">
    <h2 id="feelHead">How are you feeling right now?</h2>
    <div class="moods" id="moods"></div>
  </div>
</section>

<section class="view" id="view" hidden aria-live="polite">
  <div class="wrap">
    <article class="letter" id="letter">
      <div class="seal" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="#FFF9EF"><path d="M12 21s-7.8-4.8-9.6-9.6C1.1 8 3.2 4.4 6.9 4.4c2.2 0 3.7 1.2 5.1 3.1 1.4-1.9 2.9-3.1 5.1-3.1 3.7 0 5.8 3.6 4.5 7C19.8 16.2 12 21 12 21z"/></svg></div>
      <p class="when" id="lWhen"></p>
      <h3 id="lTitle"></h3>
      <p class="body" id="lBody"></p>
      <p class="sign">— <span data-f="yourName"></span></p>
    </article>
    <div class="side">
      <div id="extras" style="display:flex;flex-direction:column;gap:18px"></div>
      <button class="btn ghost" type="button" id="backBtn" style="align-self:flex-start">Pick another feeling</button>
    </div>
  </div>
</section>

<footer><div class="wrap"><p class="hand">Come back here whenever you need to.</p><p>Made with care by <span data-f="yourName"></span>, for <span data-f="herName"></span>.</p></div></footer>

<script src="js/script.js"></script>
</body>
</html>
